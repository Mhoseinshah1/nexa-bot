name: Exhaustive notification orderings

# The combinatorial search, off the pull-request path.
#
# 1 341 orderings, each with a full database reset. The suite itself takes
# about four minutes; carrying it took the whole CI integration job to roughly
# fourteen, so the cost of the search landed on every unrelated change. Its value is finding a shape nobody has imagined
# yet, which is worth a great deal once a night and very little on the ninth
# push of an afternoon.
#
# Nothing here is the only cover for a known bug. Every failure shape these
# enumerations found has a named, deterministic regression in
# `tests/integration/notification-invariants.test.ts`, which runs on every pull
# request. Locally: `pnpm test:exhaustive`.
on:
  schedule:
    # 03:00 UTC, daily.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  exhaustive:
    name: Exhaustive orderings
    runs-on: ubuntu-24.04
    # Generous, because the point of this job is to be thorough rather than
    # quick — but bounded, so a hang is reported rather than billed.
    timeout-minutes: 60

    env:
      DATABASE_URL: postgres://nexa:nexa@127.0.0.1:5432/nexa_test
      TEST_DATABASE_URL: postgres://nexa:nexa@127.0.0.1:5432/nexa_test
      REDIS_URL: redis://127.0.0.1:6379
      # A throwaway key for the test database only.
      SECRETS_KEK: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SECRETS_KEK_ID: ci-1

    steps:
      # Pinned to an immutable commit. A tag is a moving pointer that whoever
      # controls the action's repository can repoint at any time, and CI runs
      # with a token. The comment names the release so an update stays legible.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          BUILD_VERSION: ${{ github.sha }}
          BUILD_COMMIT: ${{ github.sha }}

      # Started here rather than as `services:` so a failed pull or a container that
      # never turns healthy is retried (scripts/ci-start-services.sh). A service
      # container that fails stops the job at "Initialize containers" with no step
      # to retry it, which is how 2/10 to 9/10 shards of one run failed on main.
      - name: Start PostgreSQL and Redis (bounded retry)
        run: bash scripts/ci-start-services.sh

      # Every ordering resets the database, and a reset TRUNCATEs ~150 tables:
      # with fsync on, that is hundreds of synced file creations per ordering.
      # The container is discarded with the job; see the script for numbers.
      - name: Make the throwaway database non-durable
        run: bash scripts/ci-test-postgres.sh "$POSTGRES_CONTAINER"
        env:
          POSTGRES_CONTAINER: nexa-ci-postgres

      - name: Apply migrations
        run: pnpm db:migrate

      # Progress per file and test as each starts, and a heartbeat, so a long
      # quiet stretch reads as slow, stuck or held open — see ci.yml.
      - name: Exhaustive notification orderings
        run: >-
          pnpm test:exhaustive
          --reporter=default
          --reporter=./tests/support/ci-progress-reporter.ts
          --reporter=hanging-process
