name: Release

# Publishing happens ONLY from a tag, and never from ordinary pull-request CI.
# A pull request that could publish is a pull request that can push code to
# every installation; the deployment job in ci.yml builds and verifies the same
# image without ever logging in to a registry.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v1.0.0'
        required: true

# Keyed on the VERSION, not on the ref.
#
# `github.ref` is `refs/tags/v1.0.0` for a tag push and `refs/heads/main` for a
# workflow_dispatch launched from main, so the two paths landed in DIFFERENT
# groups and could run at once. Both gates would then check "has this version
# been published?" before either publish job pushed, both would see no, and one
# version would end up with two digests — exactly what the immutability check
# exists to prevent.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Declared empty at the top so no job inherits anything by accident; each job
# below asks for exactly what it needs. Only `publish` gets `packages: write`.
permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  # Nothing is built, let alone published, until this job says the exact source
  # commit passed the repository's own required verification — and until it
  # confirms the version has never been published before.
  gate:
    name: Verify the source commit and the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      tag: ${{ steps.request.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      image: ${{ steps.source.outputs.image }}
    steps:
      # Every value that reaches a `run:` block arrives through `env:` and is
      # used as a quoted shell variable. Interpolating `${{ }}` into a script
      # splices the value into the source before the shell sees it.
      - name: Validate the requested tag
        id: request
        env:
          REQUESTED: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # A release tag and nothing else. This is also what stops the
          # checkout below from being pointed at a branch or a fork's SHA.
          #
          # Bash's own `=~`, not `printf | grep -E`: grep matches PER LINE, so
          # a multi-line value passes as soon as one of its lines does, and the
          # accepted value is then written to $GITHUB_OUTPUT where a second
          # line is a second step output.
          if [[ ! $REQUESTED =~ ^v[0-9A-Za-z][0-9A-Za-z._-]{0,62}$ ]]; then
            printf 'refusing to release from "%s": releases are tagged v<version>\n' "$REQUESTED" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ steps.request.outputs.tag }}

      - name: Resolve the tag to an immutable commit
        id: source
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Resolved ONCE, here, and every job below is pinned to this SHA
          # rather than re-resolving the tag. A tag is a mutable pointer: two
          # jobs that each resolve it can legitimately get different commits.
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            printf 'sha=%s\n' "$(git rev-parse HEAD^{commit})"
            printf 'image=%s/%s/nexa-bot\n' "$REGISTRY" "$owner"
          } >>"$GITHUB_OUTPUT"

      # --- The CI gate ------------------------------------------------------
      #
      # Model B of the two the owner allowed: ask GitHub what actually ran for
      # this exact commit, rather than re-running a weaker copy of CI here.
      #
      # Fails closed on everything ambiguous. A tag can be pushed by anyone
      # with write access, and without this a release could be published from a
      # commit that never passed a single check.
      - name: Require CI to have passed for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.source.outputs.sha }}
          WORKFLOW: .github/workflows/ci.yml
        run: |
          set -euo pipefail
          # `head_sha` is an exact filter, and every returned run is checked
          # against it again anyway: trusting the filter alone would make this
          # gate depend on a query parameter rather than on the data.
          runs="$(gh api --paginate \
            "repos/${REPO}/actions/runs?head_sha=${SHA}&status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.path, .head_sha, .conclusion, .event, .html_url] | @tsv')"

          if [ -z "$runs" ]; then
            printf 'no completed workflow run exists for %s.\n' "$SHA" >&2
            printf 'A release is published only from a commit that passed CI. Push the commit to a branch or open a pull request, let CI run, then tag it.\n' >&2
            exit 1
          fi

          # `success` and nothing else. `cancelled`, `skipped`, `stale`,
          # `neutral`, `action_required` and `timed_out` are all NOT a pass,
          # and treating any of them as one is how a gate becomes decoration.
          passed=0
          while IFS="$(printf '\t')" read -r path head conclusion event url; do
            [ "$path" = "$WORKFLOW" ] || continue
            [ "$head" = "$SHA" ] || continue
            [ "$conclusion" = "success" ] || continue
            printf 'found a passing %s run for %s (%s): %s\n' "$path" "$SHA" "$event" "$url"
            passed=1
          done <<EOF
          $runs
          EOF

          if [ "$passed" -ne 1 ]; then
            printf 'no SUCCESSFUL %s run for %s.\n' "$WORKFLOW" "$SHA" >&2
            printf 'Completed runs seen for this commit:\n%s\n' "$runs" >&2
            exit 1
          fi

      # --- A published version is immutable ---------------------------------
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to republish a version that already exists
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.source.outputs.image }}
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          # `workflow_dispatch` takes an arbitrary existing tag, so without
          # this a second run could rebuild v1.0.0 and move it to a new digest.
          # Installations pin digests and would not follow it, but two
          # different images would answer to one version name and no operator
          # could tell which one an installation was told to install.
          #
          # No force-republish switch, deliberately: the way to publish
          # different bytes is a new version.
          if docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            printf '%s:%s already exists in the registry.\n' "$IMAGE" "$TAG" >&2
            printf 'A published release version is immutable. Publish a new version instead.\n' >&2
            exit 1
          fi
          printf '%s:%s has not been published before.\n' "$IMAGE" "$TAG"

  publish:
    name: Build and publish the release image
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ needs.gate.outputs.tag }}
      commit: ${{ needs.gate.outputs.sha }}
      image: ${{ needs.gate.outputs.image }}
    steps:
      # Checked out by the SHA the gate resolved, NOT by re-resolving the tag.
      # A tag is a mutable pointer; two jobs that each resolve it can get two
      # different commits, and only one of them passed the gate.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Stamp the build time
        id: identity
        run: |
          set -euo pipefail
          printf 'built=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      # arm64 is emulated on an amd64 runner. It is here because the installer
      # accepts aarch64, and accepting an architecture with no published bytes
      # is a promise the registry cannot keep.
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          # Both architectures the installer accepts. Without this the action
          # builds only the runner's native platform, and an aarch64 host would
          # be told a release exists that has no bytes for it.
          platforms: linux/amd64,linux/arm64
          tags: ${{ needs.gate.outputs.image }}:${{ needs.gate.outputs.tag }}
          # Facts about the build, not credentials. Build arguments land in
          # image metadata, so nothing secret may ever appear here.
          build-args: |
            BUILD_VERSION=${{ needs.gate.outputs.tag }}
            BUILD_COMMIT=${{ needs.gate.outputs.sha }}
            BUILD_TIME=${{ steps.identity.outputs.built }}
          provenance: true
          sbom: true

      # The digest is the release's identity. Printed into the job summary so a
      # human can compare what an installation reports against what was
      # actually published, rather than trusting either in isolation.
      - name: Record the release identity
        env:
          VERSION: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          BUILT: ${{ steps.identity.outputs.built }}
        run: |
          set -euo pipefail
          {
            printf '### Release %s\n\n' "$VERSION"
            printf '| field | value |\n| --- | --- |\n'
            printf '| version | `%s` |\n' "$VERSION"
            printf '| commit | `%s` |\n' "$COMMIT"
            printf '| digest | `%s` |\n' "$DIGEST"
            printf '| built | `%s` |\n\n' "$BUILT"
            printf 'Install with:\n\n```\nsudo ./install.sh --domain <domain> --acme-email <email> --version %s\n```\n' "$VERSION"
          } >>"$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the published image
    runs-on: ubuntu-latest
    needs: [gate, publish]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: this runs AFTER the tag is public. A failure here — a missing
      # architecture, metadata that disagrees with the release — does not
      # withdraw the tag, and the gate's immutability check then makes that
      # version unpublishable for ever. The recovery is a version bump. That is
      # a deliberate trade: verifying before the tag exists would mean pushing
      # by digest and tagging afterwards, which makes the digest-to-tag step
      # the thing nothing verifies. Recorded in docs/deployment.md.
      #
      # Pulled BY DIGEST, so the verification runs against what was published.
      # Pulling the tag again would verify whatever the tag points at now,
      # which is precisely what digests exist to avoid.
      - name: Verify the artefact that was published
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          VERSION: ${{ needs.publish.outputs.version }}
          COMMIT: ${{ needs.publish.outputs.commit }}
        run: |
          set -euo pipefail
          reference="${IMAGE}@${DIGEST}"

          # Every architecture the installer accepts must have real bytes in
          # the published index. `SUPPORTED_ARCH` in deploy/install.sh is
          # x86_64 and aarch64; those are amd64 and arm64 in Docker's naming,
          # and this is the check that stops the two lists drifting apart.
          #
          # Read off the manifest that was actually pushed, by digest. If the
          # arm64 build silently did not happen, the release fails here rather
          # than an aarch64 operator discovering it at install time.
          architectures="$(docker buildx imagetools inspect "$reference" --raw |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(" ".join(sorted({m["platform"]["architecture"] for m in d.get("manifests", []) if m.get("platform", {}).get("architecture") not in (None, "unknown")})))')"
          printf 'published architectures: %s\n' "$architectures"
          for required in amd64 arm64; do
            case " $architectures " in
              *" $required "*) ;;
              *)
                printf 'the published manifest has no %s image, but the installer accepts it.\n' "$required" >&2
                exit 1
                ;;
            esac
          done

          docker pull --quiet "$reference"
          # The image must agree with the release identity. A published image
          # whose metadata names a different commit is a release nobody can
          # trace back to source.
          bash scripts/check-image.sh "$reference" "$VERSION" "$COMMIT"
