# The PRODUCTION deployment. Not the root docker-compose.yml, which is
# development infrastructure (two services, development credentials, ports
# published to loopback) and stays exactly as it is.
#
# Read with ADR-0022. The invariants this file exists to hold:
#
#   - Caddy is the ONLY thing that publishes a host port.
#   - PostgreSQL and Redis publish nothing and are not on Caddy's network.
#   - No container mounts the Docker socket, runs privileged, uses host
#     networking, or bind-mounts source.
#   - The application containers run as a non-root user.
#   - Everything restarts after a host reboot without an operator.
#
# `botctl` always invokes this as:
#   docker compose --env-file /etc/nexa/deploy.env -f /opt/nexa/deploy/compose.yml ...
# so ${NEXA_IMAGE} below is an immutable digest reference, never a tag.

name: nexa

x-app-common: &app-common
  # A DIGEST, written by the installer or by `botctl update` once it has
  # resolved the target version. Never `latest`: a tag is a pointer somebody
  # else can move, and an installation whose identity can change underneath it
  # is an installation nobody can support.
  image: ${NEXA_IMAGE:?NEXA_IMAGE must be an image digest reference}
  restart: unless-stopped
  # tini as PID 1: reaps and forwards signals. The API and worker both install
  # SIGTERM handlers and drain in-flight work, which only helps if the signal
  # arrives.
  init: true
  env_file:
    # 0600 and root-owned, so no unprivileged process on the host can read it.
    #
    # It is read by the compose CLIENT, not by the daemon — which means
    # `docker compose config` PRINTS every value in it. Anyone who can run
    # compose against this installation is already root, so this is not a new
    # exposure; it is a reason not to paste `docker compose config` output into
    # a ticket. `botctl status` exists partly so there is an output that can be.
    - ${NEXA_CONFIG_DIR:-/etc/nexa}/nexa.env
  environment:
    # THE installation's data network, handed to the application by the same
    # file and the same expression that define the network below. The panel
    # HTTP policy refuses it unconditionally, so a panel can never be pointed
    # at this installation's own PostgreSQL or Redis. One value, one source:
    # an installation whose nexa.env predates the policy is protected all the
    # same, and an operator who moved the subnet to avoid a collision keeps
    # the protection without copying the value into a second file. Extra
    # networks an operator wants refused go in PANEL_HTTP_DENIED_SUBNETS.
    NEXA_DATA_SUBNET: ${NEXA_DATA_SUBNET:-172.29.1.0/24}
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    # BOTH, for api and worker alike. `data` is internal and carries PostgreSQL
    # and Redis; `edge` is an ordinary bridge and is the only way out.
    #
    # The worker needs that egress as much as the API does, and more obviously:
    # the notification dispatcher runs in the worker and calls the Telegram API
    # over HTTPS. On `data` alone it would start, pass its health checks, claim
    # intents and fail every send with a DNS error — an installation that looks
    # healthy while every operational alert goes nowhere, which is the exact
    # failure the recording-transport guard in the config schema exists to
    # prevent by a different route.
    - data
    - edge
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    init: true
    # NO `ports`. Not "bound to loopback", not "firewalled" — absent. The
    # database is reachable from the `data` network and from nothing else, and
    # Caddy is not on that network.
    env_file:
      - ${NEXA_CONFIG_DIR:-/etc/nexa}/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    # The only service that was left with the full default capability set.
    # Postgres's entrypoint really does need five of them: it starts as root to
    # create and chown PGDATA, then drops to the postgres user with setuid and
    # setgid. Everything else — raw sockets, mknod, ptrace, module loading — it
    # has never used, and the container that holds every customer record is a
    # poor place to leave them lying around.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      # The credentials come from the environment inside the container, so
      # nothing here lands in the command line.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    init: true
    # Redis stores NOTHING through Phase 2 — see ADR-0022. It is connected and
    # health-checked; the login throttle is Postgres-backed and no queue library
    # is installed. `--save ""` and `--appendonly no` say that deliberately
    # rather than leaving a persistence volume that implies a durability
    # guarantee nothing relies on. When Redis acquires queues or locks, this
    # decision has to be revisited, and this comment is where to start.
    #
    # Two things this command is arranged to avoid.
    #
    # The password never reaches redis-server's ARGV. Passing it as a command
    # line flag put it there, where `docker top`, a `ps` from any other process
    # in the container's PID namespace, and /proc/<pid>/cmdline could all read
    # it. It goes into a 0600 config file in the container's own /tmp instead,
    # written under `umask 077` before the server starts.
    #
    # And redis does not run as root. The official image's entrypoint drops to
    # the redis user only when the command starts with `redis-server` — ours
    # starts with `sh`, so the check did not fire and the whole container ran as
    # uid 0. `user: redis` makes it explicit rather than relying on a string
    # comparison in somebody else's entrypoint.
    #
    # The literal `$$REDIS_PASSWORD` is unexpanded on purpose: compose writes a
    # single `$`, so the value comes from the container's environment and is
    # never written into the compose file or into `docker inspect`'s Cmd.
    #
    # The value is QUOTED in the config file. A command-line flag tolerated any
    # byte; a config directive is tokenised, so an unquoted password containing
    # a space would be "wrong number of arguments" and one starting with `#` a
    # comment. Installer-generated passwords are alphanumeric, but an operator
    # editing /etc/nexa/redis.env has no way to know that constraint exists.
    #
    # Worth being precise about what this buys: /proc/<pid>/environ still holds
    # the password and is readable by the redis uid, which is the only uid in
    # this container. What it removes is the host-side exposure — `docker top`
    # and a `ps` on the host showed the full argv.
    user: redis
    command:
      - sh
      - -c
      - |
        set -e
        umask 077
        printf 'requirepass "%s"\nsave ""\nappendonly no\n' "$$REDIS_PASSWORD" >/tmp/redis.conf
        exec redis-server /tmp/redis.conf
    env_file:
      - ${NEXA_CONFIG_DIR:-/etc/nexa}/redis.env
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # `redis-cli` reads REDISCLI_AUTH from the environment, so the password
      # does not appear in the health check's process line either.
      # Compared as a string rather than piped into `grep -q`: the pipeline
      # form is only safe here because `sh -c` has no `pipefail`, and a health
      # check that is correct by omission is one a later edit breaks silently.
      test: ['CMD-SHELL', '[ "$$(REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping)" = PONG ]']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # The Web Admin bundle, published from the application image into the volume
  # Caddy serves. It runs once per `up` and exits.
  #
  # Root, and ONLY this one. A named volume is created root-owned, and this job
  # writes into it; the application containers below are non-root and this is a
  # file copy rather than the application. It has no network, no capabilities
  # and no configuration — it copies a directory and stops.
  #
  # The copy has to be explicit rather than relying on Docker's populate-on-
  # first-mount: that only happens when the volume is EMPTY, so after an update
  # the volume would keep serving the previous release's assets while the API
  # served the new one.
  #
  # It is a node script rather than two shell commands, and that is the whole
  # point of it. The shell version was:
  #
  #     find /srv/web -mindepth 1 -maxdepth 1 -exec rm -rf {} +; cp -r /app/web/. /srv/web/
  #
  # — run against the directory the RUNNING Caddy was serving. Between the two
  # commands that directory is empty and during the copy it is half written, so
  # every request in the window gets a 404 for index.html or an index.html
  # naming hashed assets that are not there yet. The window is small and it is
  # on every single update.
  #
  # The publisher writes a complete release into `releases/<bundle-id>/` and
  # then activates it with ONE rename(2) of the `current` symlink, which is why
  # Caddy's SPA root names `/srv/web/current` rather than `/srv/web`. A request
  # resolves that symlink when it opens the file, so the entry document is
  # served entirely out of one release or entirely out of the other. Its
  # `/assets/*` root names `/srv/web/pool`, which holds the union over the
  # retained releases, so a document fetched a moment before a swap can still
  # load the scripts it names. See the script's own header for the layout, the
  # retention rule and the one case this does not cover
  #
  # `set -e` is not needed for the same reason a shell is not: node exits
  # non-zero on a failure and Caddy depends on this service COMPLETING
  # SUCCESSFULLY, so a failed publication stops the edge rather than starting
  # it against a half-written tree. A failure also leaves the previously
  # activated release activated — nothing is deleted before the new tree is
  # complete.
  web-assets:
    image: ${NEXA_IMAGE:?NEXA_IMAGE must be an image digest reference}
    user: '0:0'
    init: true
    restart: 'no'
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The publisher ships in the image, beside the compose file that invokes
    # it: `deploy/` is COPYed to /app/deploy in the runtime stage, and
    # `botctl update` installs a release's compose file and its image together.
    # So compose and publisher are always the same release's, in both
    # directions — an update and a rollback alike.
    #
    # No `cp -a` anywhere in it. `-a` preserves ownership, which means chown,
    # which needs CAP_CHOWN, and every capability is dropped above. The first
    # version of the shell one-shot used `-a` and exited 1 on every start,
    # which the Ubuntu CI job caught and no local check could: nothing about
    # the application looks different, the API even reports healthy, and only
    # the edge has nothing to serve. Node's cpSync copies mode bits and not
    # ownership, so the same constraint is met by construction.
    command: ['node', '/app/deploy/bin/publish-web-assets.mjs']
    volumes:
      - webassets:/srv/web

  api:
    <<: *app-common
    command: ['node', 'dist/main.js']
    healthcheck:
      # Node's global fetch — the runtime image carries no curl and does not
      # need one. A 200 from the anonymous readiness route is the same signal a
      # load balancer would use.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    <<: *app-common
    command: ['node', 'dist/main.worker.js']
    # A real signal, not "is the process running". The worker serves no HTTP,
    # so it writes a heartbeat file every WORKER_HEARTBEAT_INTERVAL_MS (10s by
    # default) — and only after a round trip to the database succeeds. This
    # check reads the file's age: younger than 30s is healthy. A worker in a
    # crash loop, alive with a blocked event loop, or alive and cut off from
    # PostgreSQL goes unhealthy within a check or two, and `botctl` treats an
    # unhealthy worker as a release that is not ready (C8).
    #
    # The path and the age must agree with the defaults in config.schema.ts;
    # a unit test pins them together.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('fs');const p=process.env.WORKER_HEARTBEAT_PATH||'/tmp/nexa-worker.heartbeat';try{const s=fs.readFileSync(p,'utf8').trim();const at=Number(s);process.exit(s!==''&&Number.isFinite(at)&&Date.now()-at<=30000?0:1)}catch{process.exit(1)}",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  monitor:
    <<: *app-common
    command: ['node', 'dist/main.monitor.js']
    # The third process role, from the SAME image. Not an interval inside the
    # API — unattended outbound calls to an operator's panels must not share an
    # event loop with the Telegram webhook — and not folded into the worker,
    # whose jobs are internal and whose delivery must not wait behind a hanging
    # panel.
    #
    # The heartbeat proves more than the worker's does. It is written only when
    # a round trip to PostgreSQL succeeds AND the monitoring loop has COMPLETED
    # an iteration recently, so a process whose timer still fires while every
    # tick throws goes unhealthy instead of reporting success for ever. A
    # deliberately disabled monitor (PANEL_MONITOR_ENABLED=false) stays healthy:
    # it is a process doing nothing on purpose, not a broken one.
    #
    # The path and the age must agree with the defaults in config.schema.ts; a
    # unit test pins them together.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('fs');const p=process.env.PANEL_MONITOR_HEARTBEAT_PATH||'/tmp/nexa-monitor.heartbeat';try{const s=fs.readFileSync(p,'utf8').trim();const at=Number(s);process.exit(s!==''&&Number.isFinite(at)&&Date.now()-at<=30000?0:1)}catch{process.exit(1)}",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    init: true
    # The only published ports in the deployment. 80 is needed for the ACME
    # HTTP-01 challenge and for the redirect to HTTPS.
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      # Interpolated from deploy.env, which holds no secrets. Caddy reads them
      # in the Caddyfile.
      NEXA_DOMAIN: ${NEXA_DOMAIN:?NEXA_DOMAIN must be set}
      NEXA_ACME_EMAIL: ${NEXA_ACME_EMAIL:?NEXA_ACME_EMAIL must be set}
    volumes:
      # The whole directory, read-only: the Caddyfile imports routes.caddy
      # beside it, and a single-file mount would leave that import dangling.
      - ${NEXA_DEPLOY_DIR:-/opt/nexa/deploy}/caddy:/etc/caddy:ro
      - webassets:/srv/web:ro
      # Certificates and ACME account state. Losing this volume means
      # re-issuing every certificate, which rate limits punish.
      - caddydata:/data
      - caddyconfig:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Binding 80/443 as a non-root user. Nothing else.
      - NET_BIND_SERVICE
    depends_on:
      web-assets:
        condition: service_completed_successfully
      api:
        # Real readiness, not a sleep. Caddy starting before the API is up
        # would serve 502s to the first requests after every deployment.
        condition: service_healthy
    healthcheck:
      # Against the INTERNAL health site (see deploy/caddy/Caddyfile), which
      # imports the same routes snippet the public site does. The obvious
      # check — loopback on :80 — sends Host: 127.0.0.1, which matches no site
      # block in production, so it proves nothing about the deployment.
      #
      # Two assertions, because two different things break. The SPA root
      # proves the asset volume was published and is being served: the one-shot
      # that copies the Web Admin bundle once failed on every start while the
      # API stayed healthy, and only the edge had nothing to serve. And
      # /health/live proves the API handle block still precedes the SPA
      # fallback — if it did not, this would still answer 200, with index.html.
      #
      # `grep -c`, not `grep -q`: a quiet grep exits on its first match and the
      # writer dies of SIGPIPE. See scripts/check-shell.sh.
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8080/ &&
          wget -q -O - http://127.0.0.1:8080/health/live | grep -c '"status":"ok"' >/dev/null
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

networks:
  # Pinned subnets, because TRUSTED_PROXY_IPS has to name the addresses Caddy
  # connects from and the application refuses an empty trusted set in
  # reverse-proxy topology. Letting Docker allocate would mean the trusted set
  # is right until the day a network is recreated in a different order.
  # Caddy reaches the API here, and the API and worker reach the internet here.
  # Caddy is NOT on `data`, so the edge has no route to the database at all.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${NEXA_EDGE_SUBNET:-172.29.0.0/24}
  data:
    driver: bridge
    # No route out. The database and Redis have no reason to reach the
    # internet, and an internal network means a compromised dependency cannot
    # call home from here.
    internal: true
    ipam:
      config:
        - subnet: ${NEXA_DATA_SUBNET:-172.29.1.0/24}

volumes:
  pgdata:
  webassets:
  caddydata:
  caddyconfig:
