<title>Nexa Admin Changes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Nexa Web Admin shell — glass sidebar + content column; 4 screens switched from the sidebar (black-and-white, Latin digits). */
:root{
  --bg:#f4f4f5; --panel:rgba(255,255,255,.86); --row:rgba(10,10,11,.035); --line:rgba(10,10,11,.09);
  --fg:#0a0a0b; --muted:#6b6b73; --accent:#0a0a0b; --accent-fg:#fff; --soft:rgba(10,10,11,.06);
  --ok:#14804a; --ok-soft:rgba(20,128,74,.12); --warn:#a86a00; --warn-soft:rgba(168,106,0,.12);
  --danger:#c0303a; --danger-soft:rgba(192,48,58,.1); --tg:#e7ecf2; --tg-msg:#fff; --tg-btn:#f1f3f6;
  --shadow:0 18px 40px -24px rgba(0,0,0,.35);
  --ff:'Vazirmatn',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0b; --panel:rgba(22,22,24,.92); --row:rgba(255,255,255,.035); --line:rgba(255,255,255,.09);
  --fg:#f4f4f5; --muted:#a1a1aa; --accent:#f4f4f5; --accent-fg:#0a0a0b; --soft:rgba(255,255,255,.08);
  --ok:#6ee7a8; --ok-soft:rgba(110,231,168,.15); --warn:#f5c56b; --warn-soft:rgba(245,197,107,.16);
  --danger:#f8848c; --danger-soft:rgba(248,132,140,.16); --tg:#17212b; --tg-msg:#182533; --tg-btn:#22303e;
  --shadow:0 30px 60px -30px rgba(0,0,0,.85); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0b; --panel:rgba(22,22,24,.92); --row:rgba(255,255,255,.035); --line:rgba(255,255,255,.09);
  --fg:#f4f4f5; --muted:#a1a1aa; --accent:#f4f4f5; --accent-fg:#0a0a0b; --soft:rgba(255,255,255,.08);
  --ok:#6ee7a8; --ok-soft:rgba(110,231,168,.15); --warn:#f5c56b; --warn-soft:rgba(245,197,107,.16);
  --danger:#f8848c; --danger-soft:rgba(248,132,140,.16); --tg:#17212b; --tg-msg:#182533; --tg-btn:#22303e;
  --shadow:0 30px 60px -30px rgba(0,0,0,.85); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ff);direction:rtl;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,select{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;max-width:1240px;margin:0 auto}
.side{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:4px;height:max-content;position:sticky;top:16px;box-shadow:var(--shadow)}
.brand{font-weight:800;font-size:17px;padding:6px 10px 12px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.nav{background:none;border:0;text-align:right;padding:9px 12px;border-radius:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav:hover{background:var(--soft)}
.nav[aria-current="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.nav .n{font-size:11px;opacity:.7}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:800;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px;max-width:70ch;line-height:1.8}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin:0 0 4px}
.chg{display:inline-flex;gap:6px;align-items:center;font-size:12px;background:var(--warn-soft);color:var(--warn);padding:3px 10px;border-radius:99px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--soft);padding:8px 14px;border-radius:12px;cursor:pointer;font-weight:600;font-size:13px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn:focus-visible,.nav:focus-visible,.sw:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 12px;cursor:pointer;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.muted{color:var(--muted)}
.pill{font-size:11.5px;padding:2px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--ok-soft);color:var(--ok)} .pill.off{background:var(--soft);color:var(--muted)}
.sw{width:40px;height:23px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:right .15s}
.sw[aria-checked="true"]{background:var(--accent)} .sw[aria-checked="true"]::after{right:20px;background:var(--accent-fg)}
/* features */
.grp{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--row);font-weight:700}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .c{font-weight:500;font-size:12.5px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.feat{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line)}
.fgrid .feat:nth-child(odd){border-left:1px solid var(--line)}
.feat .t{font-weight:600;font-size:13.5px}
.feat .d{font-size:12px;color:var(--muted);line-height:1.7;margin-top:2px}
.feat .tx{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12.5px;font-weight:600}
.fld .h{font-size:11.5px;color:var(--muted);line-height:1.7}
.inp{background:var(--row);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
.full{grid-column:1/-1}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;background:none;text-align:right;display:flex;flex-direction:column;gap:3px}
.opt[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.opt b{font-size:13px} .opt span{font-size:11.5px;color:var(--muted);line-height:1.6}
.note{font-size:12.5px;background:var(--row);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;line-height:1.8}
.doc{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:12px}
.doc code{direction:ltr;font-size:12px;background:var(--soft);padding:2px 6px;border-radius:6px;word-break:break-all}
/* phone */
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.phone{background:var(--tg);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);box-shadow:var(--shadow)}
.phone .cap{font-size:11.5px;color:var(--muted);text-align:center}
.msg{background:var(--tg-msg);border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.85}
.kb{display:flex;flex-direction:column;gap:6px}
.kbb{background:var(--tg-btn);border-radius:10px;padding:9px;text-align:center;font-size:12.5px;font-weight:600}
.seg{display:inline-flex;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--fg);width:16px;height:16px}
.gw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.gw:first-child{border-top:0}
/* reseller */
.sumbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.meter{flex:1;min-width:160px;height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.pchip{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;background:none;text-align:right;font-size:12.5px;min-width:0}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.pchip .k{font-size:11px;opacity:.75;flex:none}
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gh .r{display:flex;gap:8px;align-items:center}
.mini{font-size:12px;padding:4px 10px;border-radius:9px}
.foot{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);margin:0 -16px -16px;padding:12px 16px;border-radius:0 0 18px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);padding:9px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:20}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)} .side{position:static;flex-direction:row;flex-wrap:wrap} .brand{width:100%;padding-bottom:4px}
  .two{grid-template-columns:minmax(0,1fr)} .fgrid,.form{grid-template-columns:minmax(0,1fr)} .fgrid .feat:nth-child(odd){border-left:0}
  .opts{grid-template-columns:minmax(0,1fr)}
}

/* features variants */
.fa{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;align-items:start}
.fa-cats{display:flex;flex-direction:column;gap:4px;position:sticky;top:16px}
.fa-cat{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;cursor:pointer;text-align:right}
.fa-cat:hover{background:var(--soft)}
.fa-cat[aria-selected="true"]{background:var(--panel);border-color:var(--line);font-weight:700;box-shadow:var(--shadow)}
.fa-cat .n{font-size:12px;color:var(--muted)}
.fa-row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.fa-row .tx{flex:1;min-width:0}.fa-row .t{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fa-row .d{font-size:12.8px;line-height:1.9;margin-top:4px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.lnk{color:var(--fg);text-decoration:underline;text-underline-offset:3px;font-size:12px}
.fb-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.fb-h h2{margin:0;font-size:16px}
.fb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.fb-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fb-card.is-on{border-color:var(--fg)}
.fb-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fb-card p{margin:0;font-size:12.8px;line-height:1.9}
.fb-card dl{margin:0;display:grid;gap:6px;background:var(--row);border-radius:10px;padding:8px 10px}
.fb-card dl div{display:grid;gap:1px}.fb-card dt{font-size:11px;color:var(--muted)}.fb-card dd{margin:0;font-size:12px}
.fc{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}
.fc-list{padding:8px;max-height:640px;overflow:auto}
.fc-g{font-size:11.5px;color:var(--muted);font-weight:700;padding:10px 8px 4px;letter-spacing:.02em}
.fc-item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:right;font-size:13px}
.fc-item:hover{background:var(--soft)}.fc-item[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.dot.on{background:var(--ok)}
.fc-detail{position:sticky;top:16px}
.fc-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.fc-facts div{background:var(--row);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.fc-facts span{font-size:11.5px;color:var(--muted)}.fc-facts b{font-size:13px;font-weight:600;line-height:1.7}
@media (max-width:860px){.fa,.fc{grid-template-columns:minmax(0,1fr)}.fa-cats{position:static;flex-direction:row;flex-wrap:wrap}.fc-detail{position:static}.fc-list{max-height:300px}.fc-facts{grid-template-columns:minmax(0,1fr)}.seg{flex-wrap:wrap}}

.rs-sum{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.rs-id{display:flex;gap:12px;align-items:center}.av{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:18px}
.rs-kv{display:grid;grid-template-columns:repeat(6,auto);gap:6px 22px}.rs-kv div{display:grid;gap:2px}.rs-kv span{font-size:11.5px;color:var(--muted)}.rs-kv b{font-size:13px;font-weight:600}
.rs-tabs{display:flex;gap:6px;flex-wrap:wrap}
.rs-tab{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px}
.rs-tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.rs-tab.dz{color:var(--danger)}.rs-tab.dz[aria-selected="true"]{background:var(--danger);color:var(--accent-fg)}
.rs-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tw table{width:100%;border-collapse:collapse;font-size:13px}.tw th,.tw td{padding:9px 12px;text-align:right;border-top:1px solid var(--line)}.tw th{background:var(--row);font-size:12px;color:var(--muted);border-top:0}
.rs-meter{display:grid;gap:8px;background:var(--row);border-radius:12px;padding:12px}
.dz-box{border:1px solid var(--danger);border-radius:14px;overflow:hidden}
.dz-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}.dz-row:first-child{border-top:0}
.dz-btn{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
@media (max-width:860px){.rs-kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="shell">
  <nav class="side" aria-label="صفحه‌ها">
    <div class="brand">Nexa Admin<small>دموی ۴ تغییر برای تأیید</small></div>
    <button class="nav" data-go="features">قابلیت‌ها <span class="n">۱</span></button>
    <button class="nav" data-go="panel">افزودن پنل کاستوم <span class="n">۲</span></button>
    <button class="nav" data-go="phone">تأیید شماره <span class="n">۳</span></button>
    <button class="nav" data-go="reseller">ویرایش نماینده <span class="n">۴</span></button>
  </nav>
  <main class="main" id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const fa=s=>s;
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,1800)}

/* ---------- 1. features (3 variants) ---------- */
// [title, full description, where the customer/operator sees it, what happens when switched off, related settings, on?]
const FEATS=[
 ['اعلان‌ها و یادآوری‌ها','پیام‌هایی که ربات خودکار برای مشتری یا گروه گزارش می‌فرستد',[
  ['یادآوری انقضای سرویس','چند روز مانده به پایان سرویس، به مشتری پیام می‌دهد که تمدید کند. تعداد روزها را در تنظیمات یادآوری تعیین می‌کنید. پیام دکمهٔ «تمدید» دارد.','ربات مشتری','مشتری تا روز آخر پیامی نمی‌گیرد؛ تمدیدها معمولاً کم می‌شود.','تنظیمات یادآوری ← روزهای قبل از انقضا',1],
  ['پیام پایان سرویس','لحظه‌ای که سرویس تمام می‌شود (زمان یا حجم)، به مشتری خبر می‌دهد و دکمهٔ خرید یا تمدید می‌گذارد.','ربات مشتری','مشتری فقط وقتی متوجه می‌شود که اتصالش قطع شود.','متن‌ها ← پیام پایان سرویس',1],
  ['یادآوری مصرف حجم','وقتی مصرف سرویس به آستانهٔ تعیین‌شده رسید (مثلاً ۸۰٪)، پیام می‌دهد که حجم اضافه بگیرد.','ربات مشتری','هشدار حجم ارسال نمی‌شود.','تنظیمات یادآوری ← آستانهٔ حجم',1],
  ['یادآوری روز انقضا','در روز آخر سرویس یک پیام دیگر، جدا از یادآوری چند روز قبل، می‌فرستد.','ربات مشتری','فقط یادآوری چند روز قبل می‌ماند.','—',0],
  ['هشدار کم بودن موجودی','وقتی موجودی کیف پول مشتری کمتر از حد تعیین‌شده شد، پیام می‌دهد که شارژ کند.','ربات مشتری','هشدار موجودی فرستاده نمی‌شود.','تنظیمات کیف پول ← حداقل موجودی',0],
  ['یادآوری پیش‌فاکتور پرداخت‌نشده','اگر مشتری پیش‌فاکتور ساخت و پرداخت نکرد، یک بار یادآوری می‌کند.','ربات مشتری','سفارش‌های نیمه‌کاره بی‌یادآوری منقضی می‌شوند.','—',1],
  ['ساعت سکوت','در ساعت‌هایی که تعیین می‌کنید (مثلاً ۱ تا ۸ صبح) هیچ یادآوری‌ای نمی‌فرستد و آن‌ها را برای بعد نگه می‌دارد.','ربات مشتری','یادآوری‌ها هر ساعتی ارسال می‌شوند.','تنظیمات یادآوری ← بازهٔ سکوت',0],

let fv='a', fq='', ff='all', fcat=0, fsel=[0,0];
function fitems(gi){return FEATS[gi][2].map((f,i)=>[f,i]).filter(([f])=>(!fq||(f[0]+f[1]).includes(fq))&&(ff=='all'||(ff=='on')==!!f[5]))}
function sw(f,gi,i){return `<button class="sw" role="switch" aria-checked="${!!f[5]}" aria-label="${f[0]}" data-g="${gi}" data-i="${i}"></button>`}
function features(){
  const total=FEATS.reduce((a,g)=>a+g[2].length,0), on=FEATS.reduce((a,g)=>a+g[2].filter(f=>f[5]).length,0);
  let body='';
  if(fv==='a'){ // two-pane settings
    body=`<div class="fa"><div class="fa-cats" role="tablist">${FEATS.map((g,gi)=>`<button role="tab" class="fa-cat" aria-selected="${fcat==gi}" data-cat="${gi}"><span>${g[0]}</span><span class="n">${g[2].filter(f=>f[5]).length}/${g[2].length}</span></button>`).join('')}</div>
     <div class="card fa-pane"><h2>${FEATS[fcat][0]}</h2><p class="sub" style="margin:0 0 6px">${FEATS[fcat][1]}</p>
     ${fitems(fcat).map(([f,i])=>`<div class="fa-row"><div class="tx"><div class="t">${f[0]} <span class="pill ${f[5]?'on':'off'}">${f[5]?'روشن':'خاموش'}</span></div><div class="d">${f[1]}</div>
       <div class="meta"><span>👁 ${f[2]}</span>${f[4]!=='—'?`<a href="#features" class="lnk">⚙ ${f[4]}</a>`:''}</div></div>${sw(f,fcat,i)}</div>`).join('')||'<p class="muted">موردی نیست.</p>'}</div></div>`;
  } else if(fv==='b'){ // card grid by category
    body=FEATS.map((g,gi)=>{const it=fitems(gi);if(!it.length)return'';return `<section class="stack"><div class="fb-h"><h2>${g[0]}</h2><span class="muted" style="font-size:12.5px">${g[1]}</span></div>
     <div class="fb-grid">${it.map(([f,i])=>`<article class="fb-card ${f[5]?'is-on':''}"><div class="fb-top"><b>${f[0]}</b>${sw(f,gi,i)}</div><p>${f[1]}</p>
     <dl><div><dt>کجا</dt><dd>${f[2]}</dd></div><div><dt>اگر خاموش شود</dt><dd>${f[3]}</dd></div></dl>${f[4]!=='—'?`<a href="#features" class="lnk">⚙ ${f[4]}</a>`:''}</article>`).join('')}</div></section>`}).join('');
  } else { // master-detail
    const [sg,si]=fsel, s=FEATS[sg][2][si];
    body=`<div class="fc"><div class="card fc-list">${FEATS.map((g,gi)=>{const it=fitems(gi);if(!it.length)return'';return `<div class="fc-g">${g[0]}</div>${it.map(([f,i])=>`<button class="fc-item" aria-current="${sg==gi&&si==i}" data-sel="${gi},${i}"><span>${f[0]}</span><span class="dot ${f[5]?'on':''}" aria-label="${f[5]?'روشن':'خاموش'}"></span></button>`).join('')}`}).join('')}</div>
     <div class="card fc-detail"><div class="gh"><div><div class="muted" style="font-size:12px">${FEATS[sg][0]}</div><h2 style="font-size:19px">${s[0]}</h2></div><div class="row"><span class="pill ${s[5]?'on':'off'}">${s[5]?'روشن':'خاموش'}</span>${sw(s,sg,si)}</div></div>
     <p style="line-height:2;margin:4px 0 0">${s[1]}</p>
     <div class="fc-facts"><div><span>کجا دیده می‌شود</span><b>${s[2]}</b></div><div><span>اگر خاموش شود</span><b>${s[3]}</b></div><div><span>تنظیمات مرتبط</span><b>${s[4]}</b></div><div><span>آخرین تغییر</span><b>1405/08/11 · 22:30</b></div></div></div></div>`;
  }
  $('#view').innerHTML=`
  <div class="head"><div><h1>قابلیت‌ها</h1><p class="sub">سه مدل برای انتخاب. توضیح هر قابلیت کامل‌تر شده: چه می‌کند، کجا دیده می‌شود، اگر خاموش شود چه می‌شود، و تنظیمات مرتبطش کجاست. «پنل کاستوم» از اینجا حذف شده است.</p></div><span class="chg">تغییر ۱</span></div>
  <div class="seg" role="group" aria-label="مدل نمایش"><button data-fv="a" aria-pressed="${fv=='a'}">مدل ۱ · دسته‌ها کنار</button><button data-fv="b" aria-pressed="${fv=='b'}">مدل ۲ · کارت‌ها</button><button data-fv="c" aria-pressed="${fv=='c'}">مدل ۳ · فهرست و جزئیات</button></div>
  <div class="row"><input id="fq" class="search" placeholder="جستجوی قابلیت…" value="${fq}">
    <div class="chips" role="group" aria-label="فیلتر"><button class="chip" data-f="all" aria-pressed="${ff=='all'}">همه ${total}</button><button class="chip" data-f="on" aria-pressed="${ff=='on'}">روشن ${on}</button><button class="chip" data-f="off" aria-pressed="${ff=='off'}">خاموش ${total-on}</button></div></div>
  ${body}`;
  $('#fq').oninput=e=>{fq=e.target.value.trim();features();const i=$('#fq');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ff=b.dataset.f;features()});
  document.querySelectorAll('[data-fv]').forEach(b=>b.onclick=()=>{fv=b.dataset.fv;features()});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{fcat=+b.dataset.cat;features()});
  document.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{fsel=b.dataset.sel.split(',').map(Number);features()});
  document.querySelectorAll('.lnk').forEach(a=>a.onclick=e=>{e.preventDefault();toast('در پنل واقعی به همان صفحهٔ تنظیمات می‌رود')});
  document.querySelectorAll('#view .sw').forEach(s=>s.onclick=()=>{const f=FEATS[s.dataset.g][2][s.dataset.i];f[5]=f[5]?0:1;toast(f[0]+(f[5]?' روشن شد':' خاموش شد'));features()});
}

const P=[];
[['یک‌ماهه',['20 گیگ 30 روز','30 گیگ 30 روز','40 گیگ 30 روز','50 گیگ 30 روز','80 گیگ 30 روز','100 گیگ 30 روز']],
 ['سه‌ماهه',['100 گیگ 90 روز','150 گیگ 90 روز','200 گیگ 90 روز']],
 ['مولتی لوکیشن',['یکماهه مولتی لوکیشن ویژه','سه‌ماهه مولتی لوکیشن']],
 ['دلخواه',['حجم و زمان دلخواه']]].forEach(([c,l])=>l.forEach(n=>P.push({c,n,a:1})));
const legacy=[[120,150],[150,150],[250,150],[30,150],[60,150],[90,150],[300,1500],[500,1500],[550,1500],[31,158],[90,160],[360,1600],[90,170],[40,18],[60,180],[90,180],[80,190],[15,20],[20,20],[30,20]];
for(let i=0;i<148;i++){const[g,p]=legacy[i%legacy.length];P.push({c:'محصولات قدیمی',n:`${p} · ${g+Math.floor(i/legacy.length)} روز`,a:1})}
let rq='',rf='all',openG={'محصولات قدیمی':false};
function products(){
  const allowed=P.filter(p=>p.a).length, groups=[...new Set(P.map(p=>p.c))];
  $('#rtab').innerHTML=`
  <div class="stack"><h2>محصولات مجاز</h2>
    <div class="sumbar"><b>${allowed} از ${P.length} مجاز</b><div class="meter"><i style="width:${allowed/P.length*100}%"></i></div>
      <div class="row"><button class="btn mini" id="rall">همه مجاز</button><button class="btn mini" id="rnone">همه غیرمجاز</button><button class="btn mini" id="rcur">فقط محصولات فعلی</button></div></div>
    <div class="row"><input id="rq" class="search" placeholder="جستجوی محصول…" value="${rq}">
      <div class="chips" role="group" aria-label="فیلتر"><button class="chip" data-rf="all" aria-pressed="${rf=='all'}">همه</button><button class="chip" data-rf="on" aria-pressed="${rf=='on'}">مجاز</button><button class="chip" data-rf="off" aria-pressed="${rf=='off'}">غیرمجاز</button></div></div>
    <div class="stack">${groups.map(g=>{
      const items=P.map((p,i)=>[p,i]).filter(([p])=>p.c==g&&(!rq||p.n.includes(rq))&&(rf=='all'||(rf=='on')==!!p.a));
      if(!items.length)return'';
      const all=P.filter(p=>p.c==g), on=all.filter(p=>p.a).length, isOpen=rq||rf!='all'?true:(openG[g]!==false);
      return `<details class="grp" ${isOpen?'open':''} data-g="${g}"><summary><div class="gh" style="flex:1"><span>${g} <span class="muted" style="font-weight:500;font-size:12.5px">· ${on} از ${all.length} مجاز</span></span>
        <span class="r"><button class="sw" role="switch" aria-checked="${on==all.length}" aria-label="کل گروه ${g}" data-gall="${g}"></button></span></div></summary>
        <div class="pgrid">${items.map(([p,i])=>`<button class="pchip" aria-pressed="${!!p.a}" data-p="${i}"><span>${p.n}</span><span class="k">${p.a?'مجاز':'—'}</span></button>`).join('')}</div></details>`}).join('')}</div>
    <div class="foot" hidden><span class="muted" style="font-size:12.5px">تغییرات بعد از ذخیره اعمال می‌شود.</span><div class="row"><button class="btn">انصراف</button><button class="btn pri" id="rsave">ذخیره</button></div></div>
  </div>`;
  $('#rq').oninput=e=>{rq=e.target.value.trim();products();const i=$('#rq');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
  document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{rf=b.dataset.rf;products()});
  document.querySelectorAll('details[data-g]').forEach(d=>d.addEventListener('toggle',()=>{if(!rq&&rf=='all')openG[d.dataset.g]=d.open}));
  $('#rtab').onclick=e=>{
    const s=e.target.closest('[data-gall]');
    if(s){e.preventDefault();const g=s.dataset.gall,v=s.getAttribute('aria-checked')!=='true';P.forEach(p=>{if(p.c==g)p.a=v?1:0});products();return}
    const c=e.target.closest('[data-p]');if(c){P[c.dataset.p].a^=1;products()}
  };
  $('#rall').onclick=()=>{P.forEach(p=>p.a=1);products()};
  $('#rnone').onclick=()=>{P.forEach(p=>p.a=0);products()};
  $('#rcur').onclick=()=>{P.forEach(p=>p.a=p.c=='محصولات قدیمی'?0:1);products()};
  $('#rsave').onclick=()=>toast('محصولات مجاز ذخیره شد');
}
